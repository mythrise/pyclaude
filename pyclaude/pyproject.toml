[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyclaude"
version = "0.1.0"
description = "本地可部署的 Python 版 Claude Code — 支持 Ollama / LM Studio / 任何 OpenAI 兼容接口"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "textual>=0.61",
    "httpx>=0.27",
    "pydantic>=2.7",
    "anyio>=4.4",
    "tomli-w>=1.0",
    "html2text>=2024.2",
    "rich>=13.7",
    "anthropic>=0.28",
]

[project.optional-dependencies]
pdf = ["pdfminer.six>=20221105"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
pyclaude = "pyclaude.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
